name: cham-equality

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'chamApi/**'
            frontend:
              - 'front/**'
            app:
              - 'chamApp/**'

    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      app: ${{ steps.changes.outputs.app }}

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'


      - name: gradle 권한 추가 및 빌드
        working-directory: chamApi
        run: chmod +x ./gradlew && ./gradlew clean build -x test

      - name: 빌드된 파일 이름 변경
        run: mv ./chamApi/build/libs/*SNAPSHOT.jar ./project.jar

      - name: SCP로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: '22'
          source: project.jar
          target: /home/cham/cham-server-research/tobe


      - name: ssh 접속
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          port: 22
          script: |
            rm -rf /home/cham/cham-server-research/target
            mkdir -p /home/cham/cham-server-research/target
            mv /home/cham/cham-server-research/tobe/project.jar /home/cham/cham-server-research/target
            cd /home/cham/cham-server-research/target
            sudo fuser -k -n tcp 8081 || true
            DB_USERNAME='${{ secrets.DB_USERNAME }}' \
            DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            DB_URL='${{ secrets.DB_URL }}' \
            DB_PORT='${{ secrets.DB_PORT }}' \
            AWS_ACCESS_KEY='${{ secrets.AWS_ACCESS_KEY }}' \
            AWS_SECRET_KEY='${{ secrets.AWS_SECRET_KEY }}' \
            AWS_REGION='${{ secrets.AWS_REGION }}' \
            AWS_BUCKET='${{ secrets.AWS_BUCKET }}' \
            ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
            USER_PASSWORD='${{ secrets.USER_PASSWORD }}' \
            DATA_API_KEY='${{ secrets.DATA_API_KEY }}' \
            AZURE_TRANSLATOR_KEY='${{ secrets.AZURE_TRANSLATOR_KEY }}' \
            AZURE_TRANSLATOR_REGION='${{ secrets.AZURE_TRANSLATOR_REGION }}' \
            AZURE_TRANSLATOR_ENDPOINT='${{ secrets.AZURE_TRANSLATOR_ENDPOINT }}' \
            NCP_API_KEY_ID='${{ secrets.NCP_API_KEY_ID }}' \
            NCP_API_KEY='${{ secrets.NCP_API_KEY }}' \
            NCP_BASE_URL='${{ secrets.NCP_BASE_URL }}' \
            NCP_GEOCODING_PATH='${{ secrets.NCP_GEOCODING_PATH }}' \
            NCP_REVERSE_GEOCODING_PATH='${{ secrets.NCP_REVERSE_GEOCODING_PATH }}' \
            KAKAO_APP_ID='${{ secrets.KAKAO_APP_ID }}' \
            VWORLD_KEY='${{ secrets.VWORLD_KEY }}' \
            FIREBASE_SERVICE_ACCOUNT_BASE64='${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}' \
            nohup java \
            -Dspring.profiles.active=real \
            -Dserver.port=8081 \
            -Duser.timezone=Asia/Seoul \
            -jar project.jar > /dev/null 2>&1 &
            
            rm -rf /home/cham/cham-server-research/tobe

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: npm 인스톨
        run: cd front && npm install

      - name: npm 빌드
        run: cd front && npm run build

      - name: scp로 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          source: front/dist/*
          target: /home/cham/deploy/front-dist-temp-research

      - name: ssh 접속
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            sudo rm -rf /usr/share/nginx/cham-front-research
            sudo mkdir -p /usr/share/nginx/cham-front-research
            sudo mv /home/cham/deploy/front-dist-temp-research/* /usr/share/nginx/cham-front-research/
            sudo systemctl reload nginx

  build-app:
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    env:
      PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chamApp/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: npm 인스톨
        working-directory: chamApp
        run: npm ci

      - name: .env 생성 (react-native-config 빌드 타임 주입)
        working-directory: chamApp
        run: |
          cat > .env <<EOF
          API_BASE_URL=${{ secrets.APP_API_BASE_URL }}
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          KAKAO_MAP_APP_KEY=${{ secrets.KAKAO_MAP_APP_KEY }}
          NAVER_CLIENT_KEY=${{ secrets.NAVER_CLIENT_KEY }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APP_NAME=대전 모두의 안전
          EOF

      - name: 업로드 keystore 복원
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > chamApp/android/app/upload-keystore.jks

      - name: google-services.json 복원 (FCM 푸시)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > chamApp/android/app/google-services.json

      - name: keystore.properties 생성
        run: |
          cat > chamApp/android/keystore.properties <<EOF
          CHAM_UPLOAD_STORE_FILE=upload-keystore.jks
          CHAM_UPLOAD_KEY_ALIAS=upload
          CHAM_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHAM_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: AAB 빌드
        working-directory: chamApp/android
        # versionCode를 워크플로 실행번호로 넘겨 매 빌드 고유값 보장(중복 방지). +100 오프셋으로 수동 업로드분과 충돌 회피.
        run: chmod +x ./gradlew && ./gradlew bundleRelease --no-daemon -PappVersionCode=$(( ${{ github.run_number }} + 100 ))

      - name: AAB 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: chamApp/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Google Play 업로드. 서비스 계정 JSON 시크릿이 있을 때만 실행(없으면 아티팩트까지만).
      # 내부 테스트는 비공개 테스트로 넘어와서 뺐다. 트랙을 다시 늘릴 땐 tracks에 콤마로 추가하면
      # AAB는 1회만 올라가고 같은 versionCode가 각 트랙에 할당된다(스텝을 쪼개면 version code already used).
      # track(단수)과 함께 쓰면 액션이 에러를 내므로 tracks 하나만 사용할 것.
      - name: Play 비공개 테스트 업로드
        if: ${{ env.PLAY_SA != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: kr.or.cham.equality
          releaseFiles: chamApp/android/app/build/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          # 출시 노트. 큰 업데이트 때 chamApp/distribution/whatsnew/whatsnew-ko-KR 만 고치면 된다(프로덕션 승격 시 같이 넘어감).
          whatsNewDirectory: chamApp/distribution/whatsnew

  # iOS: Mac이 없어서 빌드·서명·TestFlight 업로드를 전부 여기서 한다.
  # public 레포라 표준 macOS 러너는 무료(-large/-xlarge 라벨은 유료라 쓰지 말 것).
  # 저장소 변수 IOS_BUILD_ENABLED=true 를 켜야 돈다 → 애플 인증서·시크릿 준비 전엔 꺼 둔다.
  build-ios:
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true' && vars.IOS_BUILD_ENABLED == 'true'
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      # Xcode 의 PROVISIONING_PROFILE_SPECIFIER(project.pbxproj Release)와 같은 이름이어야 한다.
      PROFILE_NAME: chamApp AppStore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: chamApp/package-lock.json

      - name: npm 인스톨
        working-directory: chamApp
        run: npm ci

      - name: .env 생성 (react-native-config 빌드 타임 주입)
        working-directory: chamApp
        run: |
          cat > .env <<EOF
          API_BASE_URL=${{ secrets.APP_API_BASE_URL }}
          KAKAO_NATIVE_APP_KEY=${{ secrets.KAKAO_NATIVE_APP_KEY }}
          KAKAO_MAP_APP_KEY=${{ secrets.KAKAO_MAP_APP_KEY }}
          NAVER_CLIENT_KEY=${{ secrets.NAVER_CLIENT_KEY }}
          NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_APP_NAME=대전 모두의 안전
          EOF

      - name: GoogleService-Info.plist 복원 (FCM 푸시)
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 -d > chamApp/ios/chamApp/GoogleService-Info.plist

      - name: pod install
        working-directory: chamApp/ios
        run: pod install

      - name: 배포 인증서 설치
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: 프로비저닝 프로파일 설치
        run: |
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" | base64 -d > "$dir/chamApp_AppStore.mobileprovision"
          done

      - name: 아카이브
        working-directory: chamApp/ios
        # 빌드 번호는 안드로이드 versionCode 와 같은 규칙(run_number + 100).
        run: |
          xcodebuild archive \
            -workspace chamApp.xcworkspace \
            -scheme chamApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/chamApp.xcarchive" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 100 ))

      - name: IPA 내보내기
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>kr.or.cham.equality</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/chamApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: IPA 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # App Store Connect API 키가 있을 때만 TestFlight 업로드(없으면 아티팩트까지만).
      - name: TestFlight 업로드
        if: ${{ env.ASC_KEY_ID != '' }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app -t ios \
            -f "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
