name: 앱 App Store 출시

# iOS 전용. TestFlight 에서 확인한 빌드를 심사에 내고 출시한다. 다시 빌드하지 않아 테스트한 것과 출시하는 것이 같다.
# GitHub Actions 화면에서 직접 실행한다(main 푸시로는 돌지 않음).
#
# Android 와 다른 점: 애플은 심사가 끼고(보통 하루 안팎), 단계적 출시 비율을 고를 수 없다
# (7일에 걸쳐 1→2→5→10→20→50→100% 고정). 대신 일시정지·재개·즉시 100% 가 된다.
# 설명·스크린샷·개인정보 같은 메타데이터는 App Store Connect 화면에서 관리한다. 빠진 게 있으면 submit 이 그 항목을 알려주며 실패한다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'submit=심사 제출 / release=승인된 버전 출시 / pause·resume=단계적 출시 정지·재개 / complete=100% 출시 / status=상태 보기'
        type: choice
        options:
          - submit
          - release
          - pause
          - resume
          - complete
          - status
        default: status
      build:
        description: '제출할 빌드 번호 (비우면 TestFlight 최신. submit 에만 사용)'
        required: false
      phased:
        description: '단계적 출시 (submit 에만 사용. 첫 출시는 애플이 지원하지 않아 무시됨)'
        type: boolean
        default: true
      release_after_approval:
        description: '승인되면 바로 출시 (끄면 승인 후 release 로 직접 내보냄)'
        type: boolean
        default: false

concurrency:
  group: app-promote-ios
  cancel-in-progress: false

jobs:
  store:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      BUILD_NUMBER: ${{ inputs.build }}
      PHASED: ${{ inputs.phased }}
      RELEASE_AFTER_APPROVAL: ${{ inputs.release_after_approval }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: 입력값 검증
        run: |
          if [ -n "$BUILD_NUMBER" ] && ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "빌드 번호는 숫자여야 합니다: $BUILD_NUMBER"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: jwt 설치
        run: gem install jwt --no-document

      # 잡 env 에서는 runner 컨텍스트를 못 써서(워크플로 파일 오류) 경로를 여기서 정해 다음 스텝에 넘긴다.
      - name: API 키 준비
        run: |
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d > "$RUNNER_TEMP/asc.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: 실행
        run: ruby .github/scripts/app-store.rb "$ACTION"

      - name: 키 파일 삭제
        if: always()
        run: rm -f "$ASC_KEY_PATH"
